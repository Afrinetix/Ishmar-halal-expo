<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/admin/auth.js?v=3"></script>
<script src="../assets/js/admin/crud.js?v=3"></script>
<script>
  initCrudPage({
    table: 'subscribers',
    title: 'Subscriber',
    orderBy: { column: 'created_at', ascending: false },
    searchColumns: ['email'],
    columns: [
      { key: 'email', label: 'Email' },
      { key: 'source_page', label: 'Signed Up From' },
      { key: 'created_at', label: 'Date', format: (v) => formatDate(v) },
    ],
    fields: [],
  });

  document.addEventListener('ishmar-admin-ready', async () => {
    document.getElementById('export-csv-btn').addEventListener('click', async () => {
      const { data, error } = await window.ishmarSupabase.from('subscribers').select('email, source_page, created_at');
      if (error || !data.length) return;
      const rows = [['email', 'source_page', 'created_at'], ...data.map(r => [r.email, r.source_page || '', r.created_at])];
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'ishmar-subscribers.csv';
      link.click();
    });
  });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Ishmar Halal Expo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111111'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-weight='700' font-size='58' fill='%23F4B41A' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=3">
<link rel="stylesheet" href="../assets/css/admin.css?v=3">
</head>
<body class="admin-body">

<div class="login-shell">
  <div class="login-card">
    <a href="../index.html" class="brand">
      <span class="brand__mark">I</span>
      <span class="brand__text">Ishmar<small>Halal Expo</small></span>
    </a>
    <h1>Admin sign in</h1>
    <p class="lead">Sign in with the account created in Supabase Authentication.</p>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="form-field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="form-field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Sign In</button>
    </form>
    <p class="form-note mt-3 center">Not an admin? <a href="../index.html" style="color:var(--gold-dark);font-weight:700;">Return to the site</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script>
  (async function () {
    const errorBox = document.getElementById('login-error');
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('login-submit');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('is-visible');
    }

    if (!window.ishmarSupabase) {
      showError('Supabase is not configured for this site yet. Contact your developer.');
      form.querySelectorAll('input, button').forEach((el) => (el.disabled = true));
      return;
    }

    // Already signed in? Skip straight to the dashboard.
    const { data: { session } } = await window.ishmarSupabase.auth.getSession();
    if (session) {
      window.location.href = 'dashboard.html';
      return;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('is-visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      const { error } = await window.ishmarSupabase.auth.signInWithPassword({ email, password });

      if (error) {
        showError(error.message === 'Invalid login credentials'
          ? 'Incorrect email or password.'
          : error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        return;
      }

      window.location.href = 'dashboard.html';
    });
  })();
</script>
</body>
</html>
